{% extends 'base.html' %}
{% block title %}Entrar | Mangari{% endblock %}

{% block content %}
<section class="auth-form-wrap">
    <form method="POST" class="auth-form">
        {{ form.hidden_tag() }}
        <h2>Entrar na Conta</h2>
        <div>
            <label for="email">E-mail</label>
            {{ form.email(placeholder="seu@email.com") }}
        </div>
        <div>
            <label for="password">Senha</label>
            {{ form.password(placeholder="Sua senha") }}
        </div>
        <div class="checkbox-row">
            {{ form.remember }} <label for="remember">Lembrar de mim</label>
        </div>
        <button type="submit" class="button primary">Entrar</button>
        <p style="text-align: center; font-size: 0.9rem; color: var(--color-muted); margin-top: 0.5rem;">
            Ainda não tem conta? <a href="{{ url_for('auth.register') }}" style="color: var(--color-orange);">Cadastre-se</a>
        </p>
    </form>
</section>
{% endblock %}
